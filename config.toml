# this is a required setting for this theme to appear on https://themes.gohugo.io/
# change this to a value appropriate for you
baseurl = "https://weasis.org/"
# as the official Hugo documentation recommends, we turn this off for this
# showcase; this allows the published site to be served by both http and https
canonifyURLs = true
# required for official documentation served from subfolder
relativeURLs = false

disableHugoGeneratorInject = true

# the directory where Hugo reads the themes from; this is specific to your
# installation and most certainly needs be deleted or changed
#themesdir = "../.."
# yeah, well, obviously a mandatory setting for your site, if you want to
# use this theme ;-)
theme = "hugo-theme-relearn"

# the main language of this site; also an automatic pirrrate translation is
# available in this showcase
locale = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir= true

# the site's title of this showcase; you should change this ;-)
title = "Weasis Documentation"

# Robots.txt for web crawlers
enableRobotsTXT = true

# Take each page's `lastmod` from the last commit that touched its Markdown
# file. Without this, pages carry no date at all: the sitemap has no <lastmod>,
# and the `article:modified_time` / `dateModified` metadata that search engines
# and AI crawlers read as a freshness signal is simply absent. A full-history
# checkout is required, which CI already does (`fetch-depth: 0`); a shallow
# clone silently yields zero dates instead of failing.
enableGitInfo = true

[frontmatter]
  # A front-matter `updated` field first, then the Git commit date.
  #
  # The two serve different readers. `updated: 2026-09-20` is an editorial claim —
  # "the content of this page changed on this date" — written by whoever edited
  # the page, and it is the only date shown to a human (see
  # layouts/partials/content-footer.html). The Git date is the fallback that keeps
  # <lastmod> in the sitemap and `dateModified` in the JSON-LD populated for every
  # page, so machines always have a date even where nobody has annotated one.
  #
  # The field is deliberately *not* called `lastmod`: Hugo resolves `lastmod` into
  # `.Params.lastmod` for every page through this very chain, so a template cannot
  # tell a declared value from the Git fallback. A separate name can only be there
  # because someone wrote it. That is what stops a metadata-only commit from
  # moving a visible date.
  #
  # No `date` is invented, so nothing claims a publication date it does not have.
  lastmod = ['updated', 'lastmod', ':git', 'date', 'publishDate']

[minify]
  disableCSS = false
  disableHTML = true
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = false
  
  [minify.tdewolff]
    
    [minify.tdewolff.css]
      version = 2
      precision = 0
    
    [minify.tdewolff.html]
      keepComments = false
      keepSpecialComments = true
      keepDefaultAttrVals = true
      keepDocumentTags = true
      keepEndTags = true
      keepQuotes = false
      keepWhitespace = true
    
    [minify.tdewolff.js]
      keepVarNames = false
      noNullishOperator = false
      precision = 0
      version = 0
    
    [minify.tdewolff.json]
      keepNumbers = false
      precision = 0
    
    [minify.tdewolff.svg]
      keepComments = false
      precision = 0
    
    [minify.tdewolff.xml]
      keepWhitespace = false

# settings specific to this theme's features; choose to your likings and
# consult this documentation for explanation
[params]
  editURL = "https://github.com/nroduit/nroduit.github.io/edit/main/content/"
  # Author of the site, will be used in meta information
  author.name = "Nicolas Roduit"
  # No per-page byline. The theme renders the *last modifier* taken from git,
  # which is not the same thing as the author: a contributor's commit would put
  # their name on someone else's page. Authorship is declared once in
  # `author.name` above and in the `author` field of the JSON-LD on every page,
  # which is what search engines and assistants actually read.
  #
  # The email mattered most: it published a personal address as a live mailto:
  # link on 76 pages, which is what address-harvesting crawlers collect. Support
  # belongs in GitHub Discussions, linked from the menu footer.
  #
  # Hiding the date costs nothing in search: `dateModified` in the JSON-LD and
  # `<lastmod>` in the sitemap still carry the real edit date from `enableGitInfo`
  # — only the visible line goes. That line had become misleading anyway, since a
  # metadata-only commit bumps it without the content changing.
  hideAuthorName = true
  hideAuthorEmail = true
  hideAuthorDate = true
  # Fallback preview image for pages that do not set `images` in front matter.
  # The theme fills og:image / twitter:image from page resources, and this site
  # has none (images live in static/), so without this every share and every AI
  # answer card rendered as a bare text link. See layouts/partials/custom-header.html.
  socialImage = "/images/weasis-banner.jpg"
  showVisitedLinks = true
  externalLinkTarget = '_blank'
  disableBreadcrumb = false
  disableTOC = false
  disableGeneratorVersion = true
  disableNextPrev = false
  disableLandingPageButton = true
  disableLanguageSwitchingButton = false
  titleSeparator = "|"
  # Emit directory URLs (…/tutorials/mpr/) everywhere instead of the theme's
  # default …/tutorials/mpr/index.html. The explicit form exists so a built site
  # can be browsed from the file system; on a hosted site it means every internal
  # link, every breadcrumb and `og:url` pointed at a URL that then canonicalizes
  # somewhere else — a crawl spent twice per page, and link equity split between
  # two spellings of the same address.
  disableExplicitIndexURLs = true
  # Logo: replaces the previous layouts/partials/logo.html override (deprecated in Relearn 9.0.0).
  # `linkTitle = ""` suppresses the site-title text rendered next to the logo by auto-logo.html.
  logo = { src = '/images/logo.svg' }
  linkTitle = ""
  themeVariant = [ "relearn-dark", "relearn-light" ]
  themeVariantAuto = [ "relearn-light", "relearn-dark" ]
  # `hidden: true` in front matter keeps a page out of the sidebar tree — it is
  # how /features/, /faq/, /demo/ and /get-involved/ live in the shortcut menu
  # instead. Leaving this at `true` also made the theme stamp those four pages
  # `noindex, nofollow`, i.e. four of the strongest landing pages on the site
  # were invisible to search engines and to AI crawlers while still being listed
  # in the sitemap. Hidden means "not in the menu" here, never "not indexable".
  disableSeoHiddenPages = false
  # this is for the stylesheet genertor to allow for interactivity in mermaid
  # graphs; you usually will not need it and you should remove this for
  # security reasons
  mermaidInitialize = "{ \"securityLevel\": \"loose\" }"
  jdkVersion = "25"
  mavenVersion = "3.8.1"
  # Sidebar: insert the documentation version selector (layouts/partials/sidebar/
  # element/docversion.html, fed by data/versions.toml) below the search box.
  # Reconfiguring a sidebar area resets its defaults, so the theme's own entries
  # for that area are repeated here; the theme's `versionswitcher` is dropped as
  # it drives multi-site versioning, which this site does not use.
  sidebarheadermenus = [
    { type = 'divider' },
    { type = 'custom', identifier = 'headercontrols', elements = [ { type = 'docversion' } ] },
    { type = 'divider' }
  ]
  
  [params.link]
    errorlevel = 'warning'


[outputFormats]
  
  [outputFormats.API]
    mediaType = "application/json"
    baseName = "api"
    isPlainText = true

  # Two plain-text renderings of the documentation for large language models,
  # following the llms.txt convention (https://llmstxt.org/): an annotated map of
  # every page, and the whole documentation in one file.
  #
  # Both are rendered from the home page, which lives at /en/ here — but crawlers
  # fetch https://weasis.org/llms.txt, at the root. The `../` in `baseName` is
  # what lifts the file out of the language directory: Hugo cleans the assembled
  # target path, so `en/../llms.txt` becomes `llms.txt`. That also means every
  # language would write the same two files, so the formats are enabled for
  # English only, in [Languages.en.outputs] below — which is what we want anyway,
  # the other languages having a home page and nothing else.
  #
  # `notAlternative` keeps them out of the <link rel="alternate"> list the theme
  # builds for the print and RSS renderings of a page, and `permalinkable` keeps
  # .Permalink pointing at the HTML page; templates use `absURL` for these two.
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "../llms"
    isPlainText = true
    notAlternative = true
    permalinkable = false

  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "../llms-full"
    isPlainText = true
    notAlternative = true
    permalinkable = false

[outputs]
  # add JSON to the home page to support lunr search; This is a mandatory setting
  # for the search functionality
  home = ['html', 'rss', 'print']
  section = ['html', 'rss', 'print']
  page = ['html', 'rss', 'print']

[markup]
  
  [markup.highlight]
    # if `guessSyntax = true`, there will be no unstyled code even if no language
    # was given BUT mermaid code fences will not work anymore! So this is a mandatory
    # setting for your site
    guessSyntax = false

    # here in this showcase we use our own modified chroma syntax highlightning style
    # which is imported in theme-relearn-light.css / theme-relearn-dark.css;
    # if you want to use a predefined style instead:
    # - remove the following `noClasses`
    # - set the following `style` to a predefined style name
    # - remove the `@import` of the self-defined chroma stylesheet from your CSS files
    #   (here eg.: theme-relearn-light.css / theme-relearn-dark.css)
    noClasses = false
    # style = "tango"
  
  [markup.goldmark.renderer]
    # activated for this showcase to use HTML and JavaScript; decide on your own needs;
    # if in doubt, remove this line
    unsafe = true
  
  [markup.goldmark.parser.attribute]
    block = true

[Languages]
  
  [Languages.en]
    title = "Weasis Documentation"
    weight = 1
    label = "English"

    # English is the only language with a full content tree, so it is the one
    # that renders /llms.txt and /llms-full.txt (see [outputFormats] above).
    # A per-language `outputs` replaces the whole [outputs] table rather than
    # merging into it, so `section` and `page` are repeated here verbatim —
    # leaving them out silently drops the print and RSS renderings of every
    # English page.
    [Languages.en.outputs]
      home = ['html', 'rss', 'print', 'llms', 'llmsfull']
      section = ['html', 'rss', 'print']
      page = ['html', 'rss', 'print']

    [[Languages.en.menu.shortcuts]]
      name = "<i class='fa fa-list-ul'></i> Features"
      pageRef = "features"
      weight = 5

    [[Languages.en.menu.shortcuts]]
      name = "<i class='fa fa-play-circle'></i> Live Demo"
      identifier = "ds"
      pageRef = "demo"
      weight = 10

    [[Languages.en.menu.shortcuts]]
      name = "<i class='fa fa-question-circle'></i> FAQs"
      pageRef = "faq"
      weight = 15

    [[Languages.en.menu.shortcuts]]
      name = "<i class='fa fa-user-circle'></i> Get Involved!"
      pageRef = "get-involved"
      weight = 20

  [Languages.fr]
    title = "Documentation"
    weight = 2
    label = "Français"

  [Languages.es]
    title = "Documentación"
    weight = 3
    label = "Español"

  [Languages.de]
    title = "Dokumentation"
    weight = 4
    label = "Deutsch"

  [Languages.ja]
    title = "ドキュメント"
    weight = 5
    label = "日本語"

  [Languages."zh-cn"]
    title = "文档"
    weight = 6
    label = "简体中文"

  [Languages.ko]
    title = "문서"
    weight = 7
    label = "한국어"

  [Languages.ru]
    title = "Документация"
    weight = 8
    label = "Русский"