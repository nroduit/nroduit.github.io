# https://github.com/DavidAnson/markdownlint (conventions in AGENTS.md, "Markdown, Hugo and Relearn conventions")
default: true
MD004: { style: consistent }      # keep the bullet character of each list
MD013: false                      # no line length: one sentence per line
MD024: { siblings_only: true }
MD025: { front_matter_title: "" } # the page title comes from the front matter
MD029: { style: one_or_ordered }
MD033: false                      # inline HTML is allowed where Markdown and shortcodes cannot express it
MD041: false                      # pages start at "##", the title is in the front matter
MD046: { style: fenced }
MD048: { style: backtick }
